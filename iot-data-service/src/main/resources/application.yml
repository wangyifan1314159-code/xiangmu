server:
  port: 8082

spring:
  application:
    name: iot-data-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: iot-data-service-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  jwt:
    # 必须与 iot-backend 注入同一环境变量 APP_JWT_SECRET（相同密钥，HS256，≥32 字节），
    # 用于校验 iot-backend 签发的 JWT；留空或长度不足 32 字节时本服务将拒绝启动（fail-fast）
    secret: ${APP_JWT_SECRET:}
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
    topics:
      device-agg: device.metric.agg.v1
      device-telemetry: device.telemetry.v1
      alert-events: alert.events.v1
  doris:
    url: jdbc:mysql://${DORIS_HOST:localhost}:9030/iot_lakehouse
    username: ${DORIS_USERNAME:}
    password: ${DORIS_PASSWORD:}